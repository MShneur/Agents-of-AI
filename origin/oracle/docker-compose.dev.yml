services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: origin
      POSTGRES_USER: origin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-origin_dev_only}
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
  api:
    build:
      context: ../..
      dockerfile: origin/oracle/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      ORIGIN_EXTERNAL_WRITES_ENABLED: "false"
    depends_on: [postgres, redis]
  worker:
    build:
      context: ../..
      dockerfile: origin/oracle/Dockerfile
    command: python -m app.worker
    environment:
      ORIGIN_EXTERNAL_WRITES_ENABLED: "false"
    depends_on: [postgres, redis]
volumes:
  postgres_data:
  redis_data:
