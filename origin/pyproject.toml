[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "origin-control-plane"
version = "0.6.0"
description = "Origin control plane, skills, repo engineering, UI design, source acquisition, and ecommerce trust"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.0"]

[tool.pytest.ini_options]
testpaths = ["runtime/tests"]
pythonpath = ["runtime"]
