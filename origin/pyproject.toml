[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "origin-control-plane"
version = "0.1.0"
description = "Origin B01 provider-neutral control-plane proof"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.0"]

[tool.pytest.ini_options]
testpaths = ["runtime/tests"]
pythonpath = ["runtime"]
