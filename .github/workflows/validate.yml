name: Validate

# Owner conservation rule: routine validation runs on Oracle or an approved isolated runtime.
# GitHub-hosted Actions is emergency/manual fallback only and requires an explicit decision.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check roster and README drift
        run: python3 scripts/sync-roster.py --check

      - name: Validate library structure and relative links
        run: python3 scripts/validate-structure.py
